[build]
  command = "npm run build:fast"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://www.evturkiye.com.tr/*"
  to = "https://evturkiye.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/yazar/sitki-pehlivan"
  to = "/yazar/editor-ekibi"
  status = 301

# Taslak PR'ları için önizleme derlemesi yapma (aylık derleme dakikasını korur)
[context.deploy-preview]
  ignore = "exit 0"

# CANLI YAYIN
[context.production]
  # Kredi tasarrufu: yalnızca commit mesajında [deploy] varsa canlıya derle (bkz. CLAUDE.md, .github/workflows/toplu-yayin.yml)
  ignore = "git log -1 --format=%B | grep -qiE '\\[(deploy|yayinla)\\]' && exit 1 || exit 0"
