[build]
  command = "npm run build:fast"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://www.evturkiye.com.tr/*"
  to = "https://evturkiye.com.tr/:splat"
  status = 301
  force = true

# Taslak PR'ları için önizleme derlemesi yapma (aylık derleme dakikasını korur)
[context.deploy-preview]
  ignore = "exit 0"
