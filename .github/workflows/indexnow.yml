name: IndexNow (Bing, Yandex)

# Her gün toplu yayından (12:53) sonra son 2 günde değişen sayfaları bildirir. Elle "hepsi" ile tüm site gönderilir.
on:
  schedule:
    - cron: '20 10 * * *'   # 13:20 Türkiye
  push:
    branches: [main]
    paths: ['.github/workflows/indexnow.yml']   # kurulumda bir kez tüm siteyi gönder
  workflow_dispatch:
    inputs:
      hepsi:
        description: 'Tüm sayfaları gönder'
        type: boolean
        default: false

jobs:
  bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Anahtar dosyası canlıda mı (yayın bitene kadar bekle)
        run: |
          for i in $(seq 1 30); do
            curl -sf https://evturkiye.online/085a16e8f755fad7b53815d9ed9e95b1.txt && exit 0; sleep 30
          done; echo "anahtar dosyası yayında değil"; exit 1
      - run: node scripts/indexnow.mjs ${{ (github.event_name == 'push' || inputs.hepsi) && '--hepsi' || '--gun 2' }}
