name: Android AAB (Google Play)

# Elle çalıştırılır (Actions > Android AAB > Run workflow) ya da app/ değişince derlenir.
# Çıktı: "evturkiye-aab" artefaktı (app-release.aab). Play Console'a elle yüklenir.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-aab.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Capacitor sync
        working-directory: app
        run: npm ci && npx cap sync android

      - name: google-services.json (varsa)
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
            echo "google-services.json eklendi"
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON yok: yerel Google girişi çalışmaz."
          fi

      - name: Yükleme anahtarı (varsa)
        env: { KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yok: AAB imzasız (yalnızca derleme denemesi)."
          fi

      - name: AAB derle
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: evturkiye-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
